
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Install Playwright
        run: bun x playwright install --with-deps chromium

      - name: Run frontend tests
        run: bun run test:e2e

  collaboration-service:
    name: Collaboration service (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/collaboration-service
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Run tests
        run: bun test

  auth-service:
    name: Auth service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/auth-service/pyproject.toml

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest

  java-services:
    name: ${{ matrix.service }} (Spring Boot)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [document-service, workspace-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

  walking-skeleton:
    name: Walking skeleton (Compose and Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bun x playwright install --with-deps chromium

      - name: Generate isolated local secrets
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env

      - name: Start Docker Compose
        run: docker compose up --build -d

      - name: Verify readiness and persistence across restarts
        run: python3 scripts/verify-persistence.py

      - name: Run walking skeleton integration tests
        working-directory: frontend
        run: bun x playwright test --config playwright.integration.config.ts

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: walking-skeleton-traces
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Stop the isolated CI stack
        if: always()
        run: docker compose down -v
