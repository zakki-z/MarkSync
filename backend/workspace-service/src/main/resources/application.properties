spring.application.name=workspace-service
server.port=${SERVER_PORT:8083}

# The schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# The auth service owns users; invitations resolve usernames and emails through it.
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8000}
# How long an invitation can be accepted after it is sent.
workspace.invitation.ttl=${INVITATION_TTL:7d}
