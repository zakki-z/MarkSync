[project]
name = "marksync-auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zaki23", email = "zaki@renew-energy.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.9.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
]

[project.scripts]
marksync-auth = "marksync_auth:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
